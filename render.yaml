# Render Blueprint: New > Blueprint > pick this repo. Render asks for the two secrets below.
services:
  - type: web
    name: margin-study-notes
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: READ_ONLY
        value: "true"
